<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrative Reports</title>
    <style>
        body {
            margin: 0;
            background: #f5f7fa;
            color: #12263a;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(1100px, calc(100% - 40px));
            margin: 40px auto;
            background: white;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }
        h1 { margin-top: 0; color: #123f68; }
        form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 16px;
            align-items: end;
        }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        select, input, button {
            box-sizing: border-box;
            width: 100%;
            min-height: 42px;
            padding: 9px 11px;
            border: 1px solid #aebbc7;
            border-radius: 4px;
            font: inherit;
        }
        .actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
        }
        button {
            width: auto;
            border: 0;
            background: #155c94;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button.secondary { background: #384b5c; }
        #message { min-height: 24px; margin: 20px 0 10px; }
        #message.error { color: #a12622; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px; border: 1px solid #ccd5dd; text-align: left; }
        th { background: #123f68; color: white; }
        tr:nth-child(even) { background: #eef4f8; }
        @media (max-width: 720px) {
            main { width: auto; margin: 0; border-radius: 0; }
            form { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<main>
    <h1>Administrative Reports</h1>
    <p>Select a report type and date range to review recorded SALISES usage.</p>

    <form id="report-form">
        <div>
            <label for="report-type">Report type</label>
            <select id="report-type" required>
                <option value="">Select a report</option>
                {% for value, label in report_options %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="start-date">Start date</label>
            <input id="start-date" type="date" required>
        </div>
        <div>
            <label for="end-date">End date</label>
            <input id="end-date" type="date" required>
        </div>
        <div class="actions">
            <button type="submit">Generate report</button>
            <button type="button" class="secondary" id="export-button">
                Export to Excel
            </button>
        </div>
    </form>

    <p id="message" aria-live="polite"></p>
    <div id="report-output"></div>
</main>

<script>
    const form = document.getElementById("report-form");
    const exportButton = document.getElementById("export-button");
    const message = document.getElementById("message");
    const output = document.getElementById("report-output");

    function requestData() {
        return {
            report_type: document.getElementById("report-type").value,
            start_date: document.getElementById("start-date").value,
            end_date: document.getElementById("end-date").value
        };
    }

    function showMessage(text, isError = false) {
        message.textContent = text;
        message.className = isError ? "error" : "";
    }

    function displayReport(report) {
        output.replaceChildren();
        if (!report.records.length) {
            showMessage(report.message || "No data available");
            return;
        }

        showMessage(`Found ${report.records.length} report record(s).`);
        const table = document.createElement("table");
        const headings = Object.keys(report.records[0]);
        const headerRow = table.insertRow();
        headings.forEach((heading) => {
            const cell = document.createElement("th");
            cell.textContent = heading.replaceAll("_", " ");
            headerRow.appendChild(cell);
        });

        report.records.forEach((record) => {
            const row = table.insertRow();
            headings.forEach((heading) => {
                const cell = row.insertCell();
                const value = record[heading];
                cell.textContent = Array.isArray(value) ? value.join(", ") : value;
            });
        });
        output.appendChild(table);
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showMessage("Generating report...");
        output.replaceChildren();

        const response = await fetch("{{ url_for('reports.generate_report_route') }}", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            credentials: "same-origin",
            body: JSON.stringify(requestData())
        });
        const result = await response.json();
        if (!response.ok) {
            showMessage(result.error || "The report could not be generated.", true);
            return;
        }
        displayReport(result);
    });

    exportButton.addEventListener("click", async () => {
        showMessage("Preparing Excel workbook...");
        const response = await fetch("{{ url_for('reports.export_report_route') }}", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            credentials: "same-origin",
            body: JSON.stringify(requestData())
        });
        if (!response.ok) {
            const result = await response.json();
            showMessage(result.error || "The report could not be exported.", true);
            return;
        }

        const blob = await response.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${requestData().report_type}_report.xlsx`;
        link.click();
        URL.revokeObjectURL(link.href);
        showMessage("Excel workbook downloaded.");
    });
</script>
</body>
</html>
